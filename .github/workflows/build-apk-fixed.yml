name: Build Omnirouter APK (Fixed)

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'omnirouter-ai.zip'
      - '.github/workflows/build-apk-fixed.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract project
        run: |
          rm -rf proj
          mkdir proj
          unzip -o ./omnirouter-ai.zip -d proj
          echo '=== extracted ==='
          find proj -maxdepth 2 -type f | head -100

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          cd proj
          if [ -f gradlew ]; then
            chmod +x gradlew
            sed -i '/^distributionUrl=/d' gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
            gradle --version
            gradle assembleRelease --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find proj -type f -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omnirouter-apk
          path: artifacts/*.apk
          if-no-files-found: error
