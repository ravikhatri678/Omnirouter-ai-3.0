name: Build Omnirouter APK

on:
  workflow_dispatch: {}
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip and wget
        run: sudo apt-get update && sudo apt-get install -y unzip wget

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf proj
          mkdir -p proj
          unzip -o ./omnirouter-ai.zip -d proj
          test -f proj/settings.gradle.kts
          test -f proj/app/build.gradle.kts

      - name: Fix KSP CI crash and release signing
        shell: bash
        run: |
          set -euo pipefail
          cd proj
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(Path('.').rglob('*.gradle')) + list(Path('.').rglob('*.gradle.kts')) + list(Path('.').rglob('*.toml'))
          changed = []
          for path in files:
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              new = text.replace('2.3.5', '2.3.6')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path) + ' (KSP)')

          # CI cannot access the developer's private upload keystore. Use the
          # Android debug signing key for the release artifact so the APK is
          # installable. The private production/upload key is never committed.
          app = Path('app/build.gradle.kts')
          text = app.read_text(encoding='utf-8')
          new = re.sub(
              r'(?m)^(\s*)signingConfig\s*=\s*signingConfigs\.(?:getByName\(["\']release["\']\)|release)\s*$',
              r'\1signingConfig = signingConfigs.getByName("debug")',
              text,
          )
          new = re.sub(
              r'(?m)^(\s*)signingConfig\s*=\s*signingConfigs\["release"\]\s*$',
              r'\1signingConfig = signingConfigs.getByName("debug")',
              new,
          )
          if new != text:
              app.write_text(new, encoding='utf-8')
              changed.append('app/build.gradle.kts (release signing -> debug signing)')
          else:
              print('WARNING: no release signingConfig assignment matched; checking for custom JKS references')
              if 'my-upload-key.jks' in text:
                  new = text.replace('signingConfig = signingConfigs.getByName("release")', 'signingConfig = signingConfigs.getByName("debug")')
                  app.write_text(new, encoding='utf-8')
                  changed.append('app/build.gradle.kts (fallback release signing -> debug signing)')

          print('Build fixes:', changed)
          PY

      - name: Install standalone Gradle
        shell: bash
        run: |
          set -euo pipefail
          cd proj
          rm -f gradle/wrapper/gradle-wrapper.jar
          VERSION=$(sed -n 's/^distributionUrl=.*gradle-\([0-9][0-9.]*\)-bin\.zip.*$/\1/p' gradle/wrapper/gradle-wrapper.properties | head -1)
          [ -n "$VERSION" ] || VERSION=8.13
          echo "Using Gradle $VERSION"
          wget -q "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${VERSION}/bin" >> "$GITHUB_PATH"
          "/opt/gradle-${VERSION}/bin/gradle" --version

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          cd proj
          gradle --no-daemon --stacktrace --info assembleRelease

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          find proj -type f -name '*.apk' -not -path '*/build_artifacts/*' -exec cp {} artifacts/ \;
          find artifacts -maxdepth 1 -type f -print
          test -n "$(find artifacts -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omnirouter-apk
          path: artifacts/*.apk
          if-no-files-found: error
