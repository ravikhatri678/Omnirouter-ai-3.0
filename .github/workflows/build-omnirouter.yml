name: Build Omnirouter

on:
  push:
    paths:
      - 'omnirouter-ai.zip'
      - '.github/workflows/build-omnirouter.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment
        run: sudo apt-get update && sudo apt-get install -y unzip wget

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf proj
          mkdir -p proj
          unzip -o ./omnirouter-ai.zip -d proj
          echo '=== Extracted project ==='
          find proj -maxdepth 3 -type f | sort | head -300

      - name: Disable KSP in project files
        shell: bash
        run: |
          set -euo pipefail
          cd proj
          python3 - <<'PY'
          from pathlib import Path

          gradle_files = list(Path('.').rglob('build.gradle')) + list(Path('.').rglob('build.gradle.kts'))
          changed = []
          for path in gradle_files:
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(True)
              out = []
              touched = False
              for line in lines:
                  low = line.lower()
                  # Disable KSP plugin application and KSP dependency/configuration
                  # without shell/regex quoting tricks that can break the CI script.
                  if 'google.devtools.ksp' in low or 'ksp(' in low or 'ksp ' in low or 'ksp.' in low:
                      if not line.lstrip().startswith('//') and not line.lstrip().startswith('/*'):
                          indent = line[:len(line) - len(line.lstrip())]
                          newline = '\n' if line.endswith('\n') else ''
                          out.append(f'{indent}// KSP disabled in CI: {line.strip()}{newline}')
                          touched = True
                          continue
                  out.append(line)
              if touched:
                  path.write_text(''.join(out), encoding='utf-8')
                  changed.append(str(path))

          print('KSP-disabled files:')
          for p in changed:
              print(' -', p)
          print('Remaining KSP references:')
          for path in gradle_files:
              for n, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if 'ksp' in line.lower():
                      print(f'{path}:{n}:{line}')
          PY

      - name: Install Gradle without wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd proj
          rm -f gradle/wrapper/gradle-wrapper.jar
          VERSION=$(sed -n 's/^distributionUrl=.*gradle-\([0-9][0-9.]*\)-bin\.zip.*$/\1/p' gradle/wrapper/gradle-wrapper.properties | head -1)
          if [ -z "$VERSION" ]; then VERSION=8.13; fi
          echo "Using Gradle $VERSION"
          wget -q "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${VERSION}/bin" >> "$GITHUB_PATH"
          "/opt/gradle-${VERSION}/bin/gradle" --version

      - name: Build release APK (KSP disabled)
        id: release
        shell: bash
        run: |
          set -o pipefail
          cd proj
          gradle --no-daemon --stacktrace --info -x kspReleaseKotlin -x kspDebugKotlin assembleRelease

      - name: Fallback debug APK (KSP disabled)
        if: failure() && steps.release.outcome == 'failure'
        shell: bash
        run: |
          set -o pipefail
          cd proj
          gradle --no-daemon --stacktrace --info -x kspReleaseKotlin -x kspDebugKotlin assembleDebug

      - name: Collect build artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd proj
          mkdir -p build_artifacts
          find . -type f \( -iname '*.apk' -o -iname '*.aab' \) -not -path './build_artifacts/*' -print0 | while IFS= read -r -d '' f; do
            cp --parents "$f" build_artifacts
          done
          echo '=== APK/AAB files ==='
          find build_artifacts -type f -print
          test -n "$(find build_artifacts -type f \( -iname '*.apk' -o -iname '*.aab' \) -print -quit)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnirouter-build
          path: proj/build_artifacts
          if-no-files-found: error
