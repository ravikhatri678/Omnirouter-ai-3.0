name: Build Omnirouter

on:
  push:
    paths:
      - 'omnirouter-ai.zip'
      - '.github/workflows/build-omnirouter.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment
        run: sudo apt-get update && sudo apt-get install -y unzip wget

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip archive
        run: |
          set -e
          rm -rf proj
          mkdir proj
          unzip -o ./omnirouter-ai.zip -d proj
          echo '=== Extracted project ==='
          find proj -maxdepth 3 -type f | sort | head -300

      - name: Disable KSP in project files
        shell: bash
        run: |
          set -e
          cd proj
          # Remove KSP plugin application from all Gradle Kotlin build files.
          # Merely using -x ksp... is not sufficient because the KSP plugin can
          # initialize its embedded IntelliJ/AWT runtime during configuration.
          while IFS= read -r -d '' f; do
            sed -i \
              -e '/^[[:space:]]*alias(libs\.plugins\.google\.devtools\.ksp)/s/^/\/\/ KSP disabled in CI: /' \
              -e '/^[[:space:]]*id(["'"']com\.google\.devtools\.ksp["'"'])/s/^/\/\/ KSP disabled in CI: /' \
              "$f"
          done < <(find . -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print0)
          echo '=== Remaining KSP references ==='
          grep -RniE 'google\.devtools\.ksp|kspKotlin|kspRelease|kspDebug' --include='*.gradle' --include='*.gradle.kts' . || true

      - name: Install Gradle without wrapper
        run: |
          set -e
          cd proj
          rm -f gradle/wrapper/gradle-wrapper.jar
          VERSION=$(sed -n 's/^distributionUrl=.*gradle-\([0-9][0-9.]*\)-bin\.zip.*$/\1/p' gradle/wrapper/gradle-wrapper.properties | head -1)
          if [ -z "$VERSION" ]; then VERSION=8.13; fi
          echo "Using Gradle $VERSION"
          wget -q "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${VERSION}/bin" >> "$GITHUB_PATH"
          /opt/gradle-${VERSION}/bin/gradle --version

      - name: Build release APK (KSP disabled)
        shell: bash
        run: |
          set -o pipefail
          cd proj
          gradle --no-daemon --stacktrace --info -x kspReleaseKotlin -x kspDebugKotlin assembleRelease

      - name: Fallback debug APK (KSP disabled)
        if: failure()
        shell: bash
        run: |
          set -o pipefail
          cd proj
          gradle --no-daemon --stacktrace --info -x kspReleaseKotlin -x kspDebugKotlin assembleDebug

      - name: Collect build artifacts
        shell: bash
        run: |
          set -e
          cd proj
          mkdir -p build_artifacts
          find . -type f \( -iname '*.apk' -o -iname '*.aab' \) -not -path './build_artifacts/*' -print0 | while IFS= read -r -d '' f; do
            cp --parents "$f" build_artifacts
          done
          echo '=== APK/AAB files ==='
          find build_artifacts -type f -print
          test -n "$(find build_artifacts -type f \( -iname '*.apk' -o -iname '*.aab' \) -print -quit)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnirouter-build
          path: proj/build_artifacts
          if-no-files-found: error
