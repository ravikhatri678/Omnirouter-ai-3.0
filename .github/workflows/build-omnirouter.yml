name: Build Omnirouter

on:
  workflow_dispatch:
  push:
    paths:
      - "omnirouter-ai (1).zip"
      - ".github/workflows/build-omnirouter.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Unzip archive
        shell: bash
        run: |
          set -e
          rm -rf proj
          mkdir -p proj
          unzip -o "./omnirouter-ai (1).zip" -d proj
          echo "=== Extracted files ==="
          find proj -maxdepth 3 -type f | sort | head -200

      - name: Detect Android project root
        shell: bash
        run: |
          set -e
          if [ -f "proj/settings.gradle.kts" ] || [ -f "proj/settings.gradle" ]; then
            echo "PROJECT_ROOT=proj" >> "$GITHUB_ENV"
          else
            SETTINGS_FILE=$(find proj -type f \( \
              -name "settings.gradle.kts" -o \
              -name "settings.gradle" \
            \) -print -quit)
            
            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle(.kts) not found"
              exit 1
            fi
            
            ROOT_DIR=$(dirname "$SETTINGS_FILE")
            echo "PROJECT_ROOT=$ROOT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: "${{ env.PROJECT_ROOT }}/build.gradle*"

      - name: Verify Android project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"
          echo "Project root: $(pwd)"
          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          echo "=== Project root ==="
          ls -la

      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -e
          GRADLE_VERSION="9.3.1"
          curl -fsSL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o /tmp/gradle.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q -o \
            /tmp/gradle.zip \
            -d /opt/gradle
          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          export PATH="/opt/gradle/gradle-${GRADLE_VERSION}/bin:$PATH"
          gradle --version

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Generate debug keystore
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"
          mkdir -p .
          keytool \
            -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -lh debug.keystore

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Djava.awt.headless=true"
          export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true"
          echo "=== Gradle version ==="
          gradle --version
          echo "=== Building debug APK ==="
          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            assembleDebug

      - name: Locate APK
        shell: bash
        run: |
          set -e
          echo "=== Searching for APK ==="
          find "$PROJECT_ROOT" \
            -type f \
            -iname "*.apk" \
            -print
          APK=$(find "$PROJECT_ROOT" \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -print \
            -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Found APK:"
          ls -lh "$APK"

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -f "$APK"
          test -s "$APK"
          echo "APK size:"
          du -h "$APK"
          echo "APK SHA-256:"
          sha256sum "$APK"

      - name: Prepare artifact
        shell: bash
        run: |
          set -e
          rm -rf apk_artifact
          mkdir -p apk_artifact
          cp "$APK" "apk_artifact/Omnirouter-AI-3.0-debug.apk"
          sha256sum \
            "apk_artifact/Omnirouter-AI-3.0-debug.apk" \
            > "apk_artifact/SHA256SUM.txt"
          ls -lh apk_artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omnirouter-AI-3.0-debug-APK
          path: apk_artifact/
          if-no-files-found: error
          retention-days: 30
